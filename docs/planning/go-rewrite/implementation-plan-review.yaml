      All 5 code tasks reference style anchors. Scaffolding (t-m1-001), integration
      tests (t-m3-002), and docs (t-m3-003) appropriately excluded.
      All anchors verified against parse-failures.js — line numbers and patterns are accurate:
        - :42-79 → parseJunitReports (XML parsing loop) ✓
        - :14-16 → Module imports ✓
        - :97-148 → cleanHtmlBlocks (HTML/ANSI cleaning) ✓
        - :173-249 → generateChecklist (markdown generation) ✓
        - :270-289 → main (CLI entrypoint) ✓
        - :46 → readdirSync directory reading ✓

  tdd_requirements:
    test_first_compliance: 100
    tdd_flag_set: false
    violations: []
    notes: |
      No global tdd_required flag, but all code tasks include detailed TDD checklists
      with test-first steps. This is effectively better than a flag — each task specifies
      exact failing test → implement → verify cycle.

  drift_prevention:
    affirmative_instructions: 85
    ambiguous_tasks: []
    notes: |
      All tasks include drift policies with STOP criteria, file scope limits, and
      validation commands. Instructions use a mix of affirmative ("ONLY use", "MUST pass")
      and negative ("Do NOT") framing. Minor deduction for negative framing patterns
      in t-m1-001 ("Do NOT install Kong yet", "Do NOT delete any existing Node.js files").

